<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c2a"/>
      <stop offset="0.45" stop-color="#2b1b4f"/>
      <stop offset="0.75" stop-color="#8a3b63"/>
      <stop offset="1" stop-color="#f08a5d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a5d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b0c2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6a0"/>
      <stop offset="0.6" stop-color="#ff9a6b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff9a6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="0.5" stop-color="#ffc2a1"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <circle cx="930" cy="250" r="120" fill="url(#sun)"/>

  <!-- twinkling stars -->
  <g fill="#fff">
    <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="70" r="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="35" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="95" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="140" r="0.8"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- neural network constellation -->
  <g stroke="#b9a7ff" stroke-width="1" fill="none" opacity="0.7">
    <path d="M700 60 L780 40 L860 80 L800 130 L700 60 M780 40 L800 130 M860 80 L960 55 L1050 100 L980 150 L860 80 M960 55 L980 150 M1050 100 L1130 70"
          stroke-dasharray="1400" stroke-dashoffset="1400">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="4s" fill="freeze"/>
    </path>
  </g>
  <g fill="#ffe9d6">
    <circle cx="700" cy="60" r="3"><animate attributeName="r" values="2.5;5;2.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="40" r="3"><animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="80" r="3.5"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="130" r="3"><animate attributeName="r" values="2.5;5;2.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="55" r="3"><animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="100" r="3"><animate attributeName="r" values="2.5;5.5;2.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="150" r="3"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="70" r="3.5"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="60" y="150" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="58" font-weight="700" fill="url(#ink)" letter-spacing="2">rafeed sultan</text>
  <text x="62" y="190" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="18" fill="#ffd6c2" opacity="0">
    evaluating machines · aligning minds
    <animate attributeName="opacity" from="0" to="0.95" begin="1s" dur="1.5s" fill="freeze"/>
  </text>
  <text x="62" y="218" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" fill="#c9b8ff" opacity="0">
    base: dhaka  →  fine-tuned: sydney
    <animate attributeName="opacity" from="0" to="0.9" begin="2s" dur="1.5s" fill="freeze"/>
  </text>
  <rect x="356" y="205" width="9" height="16" fill="#c9b8ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- harbour skyline silhouette -->
  <g fill="#120d26">
    <!-- bridge -->
    <path d="M560 290 Q720 170 880 290 L870 290 Q720 185 570 290 Z"/>
    <rect x="540" y="282" width="360" height="6"/>
    <rect x="545" y="250" width="16" height="40"/>
    <rect x="880" y="250" width="16" height="40"/>
    <g stroke="#120d26" stroke-width="2">
      <line x1="620" y1="254" x2="620" y2="284"/><line x1="660" y1="239" x2="660" y2="284"/>
      <line x1="700" y1="231" x2="700" y2="284"/><line x1="740" y1="231" x2="740" y2="284"/>
      <line x1="780" y1="239" x2="780" y2="284"/><line x1="820" y1="254" x2="820" y2="284"/>
    </g>
    <!-- sails -->
    <path d="M940 292 Q965 230 1000 222 Q985 260 990 292 Z"/>
    <path d="M985 292 Q1010 238 1050 232 Q1035 265 1040 292 Z"/>
    <path d="M1035 292 Q1058 250 1090 248 Q1078 272 1082 292 Z"/>
    <rect x="925" y="290" width="175" height="6"/>
    <!-- city blocks -->
    <rect x="0" y="270" width="30" height="22"/><rect x="34" y="250" width="22" height="42"/>
    <rect x="60" y="262" width="34" height="30"/><rect x="98" y="240" width="18" height="52"/>
    <rect x="120" y="268" width="40" height="24"/><rect x="1110" y="262" width="30" height="30"/>
    <rect x="1144" y="244" width="22" height="48"/><rect x="1170" y="266" width="30" height="26"/>
  </g>

  <!-- water -->
  <rect x="0" y="292" width="1200" height="68" fill="url(#water)"/>
  <g stroke="#ffd6a0" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M0 310 Q30 305 60 310 T120 310 T180 310 T240 310 T300 310 T360 310 T420 310 T480 310 T540 310 T600 310 T660 310 T720 310 T780 310 T840 310 T900 310 T960 310 T1020 310 T1080 310 T1140 310 T1200 310 T1260 310">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 330 Q40 325 80 330 T160 330 T240 330 T320 330 T400 330 T480 330 T560 330 T640 330 T720 330 T800 330 T880 330 T960 330 T1040 330 T1120 330 T1200 330 T1280 330" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="-80 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
